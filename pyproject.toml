[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-gandr"
version = "0.1.4"
description = "Official Gandr TTS integration for Pipecat"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Gandr", email = "contact@gandr.ai"},
]
keywords = ["pipecat", "tts", "text-to-speech", "voice-agents", "gandr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "pipecat-ai>=0.0.108,<2.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.1.1",
    "websockets>=15.0.1,<16.0",
]

[project.urls]
Homepage = "https://gandr.ai"
Documentation = "https://gandr.ai/docs"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pipecat-ai[deepgram,local,openai,silero]>=0.0.108,<2.0.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.13.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_gandr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
